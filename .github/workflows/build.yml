name: build-cpu-oc
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  RELEASE_TAG: kernel-src
  ASSET: SM-A075F_16_Opensource.zip
  KREL: 6.12.69-android16-6-abA075FXXU7DZJ5-4k   # = uname -r on the phone

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore prepared kernel tree
        id: kcache
        uses: actions/cache/restore@v4
        with:
          path: ksrc/kernel-6.12
          key: ktree-${{ hashFiles('a07_config') }}-clang19-krel-v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev libdw-dev \
            zlib1g-dev unzip dwarves binutils
          if ! sudo apt-get install -y clang-19 lld-19 llvm-19; then
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 19
          fi
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Fetch kernel source from the release
        if: steps.kcache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -p "$ASSET" -D dl
          cd dl && unzip -q "$ASSET"
          mkdir -p ../ksrc
          tar xzf Kernel.tar.gz -C ../ksrc
          tar xzf Platform.tar.gz -C ../ksrc

      - name: Prepare kernel headers
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          KSRC=$(realpath ksrc/kernel-6.12)
          cp a07_config "$KSRC/.config"
          cd "$KSRC"
          scripts/config --file .config -d TRIM_UNUSED_KSYMS -d MODULE_SIG_ALL \
            -d HEADERS_INSTALL -d WERROR \
            --set-str UNUSED_KSYMS_WHITELIST ""
          make ARCH=arm64 LLVM=1 KERNELRELEASE="$KREL" olddefconfig > /tmp/old.log 2>&1 || { tail -40 /tmp/old.log; exit 1; }
          if ! make ARCH=arm64 LLVM=1 KERNELRELEASE="$KREL" modules_prepare -j$(nproc) > /tmp/prep.log 2>&1; then
            make ARCH=arm64 LLVM=1 KERNELRELEASE="$KREL" modules_prepare -j1 > /tmp/prep2.log 2>&1 || true
            echo "=== ERRORS ==="
            grep -nE "error|\*\*\*|No such file|undefined" /tmp/prep2.log | head -40
            tail -40 /tmp/prep2.log
            exit 1
          fi
          tail -5 /tmp/prep.log
          grep UTS_RELEASE include/generated/utsrelease.h

      - name: Save prepared kernel tree to cache
        if: steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ksrc/kernel-6.12
          key: ktree-${{ hashFiles('a07_config') }}-clang19-krel-v3

      - name: Build module
        run: |
          KSRC="$GITHUB_WORKSPACE/ksrc/kernel-6.12"
          test -x "$KSRC/scripts/config" || { echo "CACHE OR TREE BROKEN"; exit 1; }
          test -s device.symvers || { echo "device.symvers missing in repo root"; exit 1; }
          grep -c . device.symvers
          grep -P '\tmodule_layout\t' device.symvers || echo "WARNING: module_layout not in device.symvers"
          cp device.symvers "$KSRC/Module.symvers"
          mkdir -p modbuild
          cp cpu_oc.c gpu_oc.c modbuild/
          echo 'obj-m += cpu_oc.o gpu_oc.o' > modbuild/Kbuild
          KBUILD_MODPOST_WARN=1 make -C "$KSRC" M="$GITHUB_WORKSPACE/modbuild" \
            ARCH=arm64 LLVM=1 KERNELRELEASE="$KREL" modules > /tmp/mod.log 2>&1 || {
              echo "=== BUILD FAILED ==="; tail -40 /tmp/mod.log
              echo "=== mod.c ==="; sed -n 1,60p modbuild/cpu_oc.mod.c; exit 1; }
          tail -15 /tmp/mod.log
          ls -la modbuild/cpu_oc.ko modbuild/gpu_oc.ko
          test "$(modinfo -F vermagic modbuild/cpu_oc.ko | awk '{print $1}')" = "$KREL"
          {
            echo "=== modinfo ==="; modinfo modbuild/cpu_oc.ko; modinfo modbuild/gpu_oc.ko
            echo "=== undefined symbols ==="; llvm-nm -u modbuild/cpu_oc.ko; llvm-nm -u modbuild/gpu_oc.ko
          } > diag.txt 2>&1 || true
          cat diag.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cpu-oc
          path: |
            modbuild/cpu_oc.ko
            modbuild/gpu_oc.ko
            diag.txt

  loader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build loader
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -static -O2 loader.c -o loader
          ls -la loader
      - uses: actions/upload-artifact@v4
        with:
          name: loader
          path: loader

  package-webui:
    needs: [build, loader]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpu-oc
          path: artifacts/cpu-oc
      - uses: actions/download-artifact@v4
        with:
          name: loader
          path: artifacts/loader
      - name: Package KernelSU module with CPU controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/META-INF/com/google/android
          cp module.prop package/module.prop
          cp -R webroot package/webroot
          cp artifacts/cpu-oc/cpu_oc.ko package/cpu_oc.ko
          cp artifacts/loader/loader package/loader
          test -s package/cpu_oc.ko && test -s package/loader
          chmod 0755 package/loader

          # Bundle the KernelSU JavaScript API import for Android WebView.
          npm install --no-save --no-package-lock kernelsu esbuild
          ./node_modules/.bin/esbuild webroot/app.js --bundle --format=iife --platform=browser --target=es2020 --outfile=package/webroot/app.js
          test -s package/webroot/app.js
          if grep -qE "from ['\"]kernelsu['\"]" package/webroot/app.js; then
            echo "KernelSU import was not bundled"
            exit 1
          fi

          cat > package/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh
          OUTFD="$2"
          ZIPFILE="$3"
          MODID="heilog99_control"
          MODPATH="/data/adb/modules_update/$MODID"

          ui_print() {
            echo "ui_print $1" >&"$OUTFD"
            echo "ui_print" >&"$OUTFD"
          }
          abort() {
            ui_print "ERROR: $1"
            exit 1
          }

          ui_print "Installing Helio G99 Control WebUI"
          mkdir -p "$MODPATH" || abort "Cannot create module directory"
          unzip -o "$ZIPFILE" "module.prop" "webroot/*" "cpu_oc.ko" "loader" -d "$MODPATH" >/dev/null 2>&1 || abort "Cannot extract WebUI files"
          [ -s "$MODPATH/module.prop" ] || abort "module.prop missing"
          [ -s "$MODPATH/webroot/index.html" ] || abort "webroot/index.html missing"
          [ -s "$MODPATH/cpu_oc.ko" ] || abort "cpu_oc.ko missing"
          [ -s "$MODPATH/loader" ] || abort "loader missing"
          find "$MODPATH" -type d -exec chmod 0755 {} \; 2>/dev/null
          find "$MODPATH" -type f -exec chmod 0644 {} \; 2>/dev/null
          chmod 0755 "$MODPATH/loader" || abort "Cannot make loader executable"
          ui_print "Installed dashboard, CPU module, and loader."
          ui_print "CPU OC remains OFF until enabled from the CPU page."
          exit 0
          EOF
          chmod 0755 package/META-INF/com/google/android/update-binary
          : > package/META-INF/com/google/android/updater-script
          (cd package && zip -qr ../HelioG99-Control-WebUI-KSU.zip .)
          unzip -t HelioG99-Control-WebUI-KSU.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HelioG99-Control-WebUI-KSU
          path: HelioG99-Control-WebUI-KSU.zip
