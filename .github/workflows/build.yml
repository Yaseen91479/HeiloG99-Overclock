name: build-cpu-oc
on: workflow_dispatch

env:
  RELEASE_TAG: kernel-src
  ASSET: SM-A075F_16_Opensource.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev unzip \
            dwarves gcc-aarch64-linux-gnu
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Fetch kernel source from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -p "$ASSET" -D dl
          cd dl && unzip -q "$ASSET"
          mkdir -p ../ksrc
          tar xzf Kernel.tar.gz -C ../ksrc
          tar xzf Platform.tar.gz -C ../ksrc

      - name: Prepare kernel headers
        run: |
          echo "=== candidates ==="
          find ksrc -type f -path '*/scripts/config' | head
          S=$(find ksrc -type f -path '*/scripts/config' | head -1)
          if [ -z "$S" ]; then
            echo "no kernel tree with scripts/config found"
            find ksrc -maxdepth 3 -type d | head -60
            exit 1
          fi
          KSRC=$(realpath "$(dirname "$(dirname "$S")")")
          echo "KSRC=$KSRC" >> "$GITHUB_ENV"
          echo "Kernel tree: $KSRC"
          head -5 "$KSRC/Makefile"
          cp a07_config "$KSRC/.config"
          cd "$KSRC"
          scripts/config --file .config -d TRIM_UNUSED_KSYMS -d MODULE_SIG_ALL \
            -d HEADERS_INSTALL -d WERROR \
            --set-str UNUSED_KSYMS_WHITELIST ""
          make ARCH=arm64 LLVM=1 olddefconfig
          echo "=== config differences vs device (should be small) ==="
          diff <(grep -E '^(CONFIG_|# CONFIG_)' "$GITHUB_WORKSPACE/a07_config" | sort) \
               <(grep -E '^(CONFIG_|# CONFIG_)' .config | sort) | head -60 || true
          if ! make ARCH=arm64 LLVM=1 modules_prepare -j$(nproc) > /tmp/prep.log 2>&1; then
            echo "=== parallel build failed, retrying single job to find the error ==="
            make ARCH=arm64 LLVM=1 modules_prepare -j1 > /tmp/prep2.log 2>&1 || true
            echo "=== ERRORS ==="
            grep -nE "error|Error|\*\*\*|No such file|undefined" /tmp/prep2.log | head -40
            echo "==
