name: build-cpu-oc
on: workflow_dispatch

env:
  RELEASE_TAG: kernel-src            # <- the tag you create in Releases
  ASSET: SM-A075F_16_Opensource.zip  # <- the exact file name you uploaded

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libssl-dev libelf-dev unzip \
            gcc-aarch64-linux-gnu
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Fetch kernel source from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -p "$ASSET" -D dl
          cd dl && unzip -q "$ASSET" && ls -la
          mkdir -p ../ksrc
          for f in *.tar.gz; do tar xzf "$f" -C ../ksrc; done

      - name: Prepare kernel headers
        run: |
          A=$(find ksrc -type d -path '*/arch/arm64' | head -1)
          KSRC=$(realpath "${A%/arch/arm64}")
          echo "KSRC=$KSRC" >> "$GITHUB_ENV"
          echo "Kernel tree: $KSRC"
          head -5 "$KSRC/Makefile"
          cp a07_config "$KSRC/.config"
          cd "$KSRC"
          scripts/config --file .config \
            -d TRIM_UNUSED_KSYMS -d MODVERSIONS -d MODULE_SIG -d MODULE_SIG_ALL \
            -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES \
            --set-str MODULE_SIG_KEY "" --set-str UNUSED_KSYMS_WHITELIST ""
          make ARCH=arm64 LLVM=1 olddefconfig
          make ARCH=arm64 LLVM=1 modules_prepare -j$(nproc)

      - name: Build module
        run: |
          mkdir -p modbuild
          cp cpu_oc.c modbuild/
          echo 'obj-m += cpu_oc.o' > modbuild/Kbuild
          KBUILD_MODPOST_WARN=1 make -C "$KSRC" M="$PWD/modbuild" \
            ARCH=arm64 LLVM=1 modules
          ls -la modbuild/*.ko

      - name: Build loader
        run: aarch64-linux-gnu-gcc -static -O2 loader.c -o loader

      - uses: actions/upload-artifact@v4
        with:
          name: cpu-oc
          path: |
            modbuild/cpu_oc.ko
            loader
